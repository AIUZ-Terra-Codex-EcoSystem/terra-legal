name: Terra Legal Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check normative surface
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            README.md LICENSE LICENSE.md LEGAL.md NOTICE CITATION.cff REUSE.toml
            THIRD_PARTY_NOTICES.md CONTRIBUTOR_TERMS.md CONTRIBUTING.md GOVERNANCE.md
            RESPONSIBLE_USE_POLICY.md TRADEMARK_POLICY.md SECURITY.md CODE_OF_CONDUCT.md
            RULE_0_SOURCE_FIRST_PROTOCOL.md DETOX_ENGINE_PROTOCOL.md TRACELOG_PROTOCOL.md
            VALIDATION_PROTOCOL.md AUDIT_REGULATION.md AUDIT_COMPLETION_PROTOCOL.md
            VALIDATION_AUDIT_STACK.md EVIDENCE_AND_PROVENANCE_PROTOCOL.md
            INDEPENDENT_REVIEW_PROTOCOL.md RISK_AND_RELEASE_GATE_PROTOCOL.md
            FINAL_VALIDATION_AUDIT.md TL_007.md
            decisions/2026-06-14-publication-decision.md
            traces/TL-2026-06-14-004.md traces/TL-2026-06-14-005.md traces/TL-2026-06-14-006.md
            audits/2026-06-14-terra-legal-stabilization-v2.md
            audits/2026-06-14-pr3-rule0-reconciliation.md
            audits/2026-06-14-pr2-merge-readiness.md
            LICENSES/CC-BY-4.0.txt LICENSES/Apache-2.0.txt
            legal-drafts/TERRA_PUBLIC_LICENSE_v1.0_DRAFT.md
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

          test ! -e PR2_NOT_OPENED.md || { echo "Obsolete pre-PR marker is present"; exit 1; }

          grep -Fq "No single blanket license" LEGAL.md
          grep -Fq "intentionally limited stabilization mapping" REUSE.toml
          grep -Fq "Licensing is file-specific" CITATION.cff
          grep -Fq "https://orcid.org/0009-0000-6394-4912" CITATION.cff
          grep -Fq "Search existing ecosystem artifacts first" RULE_0_SOURCE_FIRST_PROTOCOL.md
          grep -Fq "Fabricated precision" DETOX_ENGINE_PROTOCOL.md
          grep -Fq "Evidence and claim validation" VALIDATION_PROTOCOL.md
          grep -Fq "GO WITH EXCLUSIONS" RISK_AND_RELEASE_GATE_PROTOCOL.md
          grep -Fq "GO WITH EXCLUSIONS" decisions/2026-06-14-publication-decision.md
          grep -Fq "TL-2026-06-14-007" TL_007.md
          grep -Fq "conditional pass" FINAL_VALIDATION_AUDIT.md
          grep -Fq "do not retroactively change" CONTRIBUTOR_TERMS.md
          grep -Fq "explicit approval by the Lead Maintainer" CONTRIBUTOR_TERMS.md

          if grep -Fq '**/*.md' REUSE.toml || grep -Fq '**/*.html' REUSE.toml || grep -Fq '.github/workflows/*.yml' REUSE.toml; then
            echo "Broad wildcard relicensing pattern detected in REUSE.toml"
            exit 1
          fi

          if grep -Eq '^(license|doi|date-released):[[:space:]]*[^#[:space:]]' CITATION.cff; then
            echo "Unverified repository-wide license, DOI, or release date is active"
            exit 1
          fi

          unpinned="$(grep -RHhoE --exclude='zenodo-release.yml' 'uses:[[:space:]]*[^[:space:]]+@[^[:space:]]+' .github/workflows | grep -Ev '@[0-9a-fA-F]{40}([[:space:]]|$)' || true)"
          test -z "$unpinned" || { echo "An approved external Action is not pinned"; echo "$unpinned"; exit 1; }

          echo "Normative, evidence, review, risk, final-audit, and approved dependency controls passed." >> "$GITHUB_STEP_SUMMARY"
          echo "Legacy Zenodo metadata workflow remains outside the approved publication scope and must not be treated as a deposit." >> "$GITHUB_STEP_SUMMARY"

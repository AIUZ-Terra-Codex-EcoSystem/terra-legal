name: Terra Legal Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate legal, governance, and rights surface
        shell: bash
        run: |
          set -euo pipefail

          fail=0
          warn=0
          summary="$GITHUB_STEP_SUMMARY"

          echo "## Terra Legal Audit" >> "$summary"

          require_file() {
            local file="$1"
            local label="$2"
            if [ -f "$file" ]; then
              echo "- PASS: $label ($file)" >> "$summary"
            else
              echo "- FAIL: $label missing ($file)" >> "$summary"
              fail=1
            fi
          }

          require_text() {
            local file="$1"
            local text="$2"
            local label="$3"
            if [ -f "$file" ] && grep -Fq -- "$text" "$file"; then
              echo "- PASS: $label" >> "$summary"
            else
              echo "- FAIL: $label" >> "$summary"
              fail=1
            fi
          }

          echo "### Required files" >> "$summary"
          require_file "README.md" "README"
          require_file "LICENSE" "root license notice"
          require_file "LICENSE.md" "license policy"
          require_file "LEGAL.md" "legal scope notice"
          require_file "CITATION.cff" "citation metadata"
          require_file "REUSE.toml" "REUSE mapping"
          require_file "THIRD_PARTY_NOTICES.md" "third-party register"
          require_file "RESPONSIBLE_USE_POLICY.md" "responsible-use policy"
          require_file "TRADEMARK_POLICY.md" "trademark policy"
          require_file "SECURITY.md" "security policy"
          require_file "CONTRIBUTING.md" "contribution policy"
          require_file "CODE_OF_CONDUCT.md" "code of conduct"
          require_file "GOVERNANCE.md" "governance policy"
          require_file "TRACELOG.md" "TraceLog"
          require_file "TERRA_UNIVERSAL_CONVENTION.md" "Universal Convention"
          require_file "PUBLICATION_RULE.md" "publication rule"
          require_file "LICENSES/CC-BY-4.0.txt" "CC BY 4.0 reference"
          require_file "LICENSES/Apache-2.0.txt" "Apache-2.0 reference"
          require_file "legal-drafts/TERRA_PUBLIC_LICENSE_v1.0_DRAFT.md" "Terra Public License draft"

          echo "### License alignment" >> "$summary"
          require_text "LICENSE.md" "CC-BY-4.0" "documentation license declared"
          require_text "LICENSE.md" "Apache-2.0" "software-like license declared"
          require_text "LICENSE.md" "legal-drafts/TERRA_PUBLIC_LICENSE_v1.0_DRAFT.md" "custom draft separated"
          require_text "LEGAL.md" "review required" "ambiguous files require review"
          require_text "CITATION.cff" "license: \"CC-BY-4.0\"" "citation no longer declares CC0"
          require_text "CITATION.cff" "https://orcid.org/0009-0000-6394-4912" "ORCID aligned"
          require_text "CITATION.cff" "https://github.com/AIUZ-Terra-Codex-EcoSystem/terra-legal" "repository URL aligned"

          echo "### REUSE mapping" >> "$summary"
          require_text "REUSE.toml" "path = \"legal-drafts/**\"" "legal drafts separately mapped"
          require_text "REUSE.toml" "LicenseRef-Terra-Legal-Draft" "draft LicenseRef declared"
          require_text "REUSE.toml" "path = \".github/workflows/*.yml\"" "workflows mapped as software-like files"

          echo "### Third-party register" >> "$summary"
          require_text "THIRD_PARTY_NOTICES.md" "actions/checkout@v4" "checkout action registered"
          require_text "THIRD_PARTY_NOTICES.md" "softprops/action-gh-release@v2" "release action registered"
          require_text "THIRD_PARTY_NOTICES.md" "does not itself deposit files in Zenodo" "Zenodo workflow boundary stated"

          action_refs="$(grep -RhoE 'uses:[[:space:]]*[^[:space:]]+@[^[:space:]]+' .github/workflows 2>/dev/null | sed -E 's/^uses:[[:space:]]*//' | sort -u || true)"
          if [ -n "$action_refs" ]; then
            echo "### External action references" >> "$summary"
            printf '%s\n' "$action_refs" | sed 's/^/- /' >> "$summary"
          fi

          if printf '%s\n' "$action_refs" | grep -Eq '@(main|master|latest)$'; then
            echo "- FAIL: floating action reference detected" >> "$summary"
            fail=1
          fi

          if printf '%s\n' "$action_refs" | grep -Evq '@[0-9a-fA-F]{40}$'; then
            echo "- REVIEW: action tags are not pinned to full commit SHAs" >> "$summary"
            warn=1
          fi

          if grep -Eq '^doi:[[:space:]].*TODO' CITATION.cff; then
            echo "- FAIL: active placeholder DOI found" >> "$summary"
            fail=1
          else
            echo "- PASS: no active placeholder DOI" >> "$summary"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "### Result: FAILED" >> "$summary"
            exit 1
          fi

          if [ "$warn" -ne 0 ]; then
            echo "### Result: PASSED WITH REVIEW NOTES" >> "$summary"
          else
            echo "### Result: PASSED" >> "$summary"
          fi
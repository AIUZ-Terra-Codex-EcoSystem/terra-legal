# Initial REUSE-style mapping for terra-legal.
# This file is a stabilization aid, not a substitute for file-by-file legal review.

version = 1

[[annotations]]
path = "**/*.md"
SPDX-FileCopyrightText = "2025-2026 Abdurashid Abdulkhamitovich Abdukarimov"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "**/*.html"
SPDX-FileCopyrightText = "2025-2026 Abdurashid Abdulkhamitovich Abdukarimov"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "**/*.css"
SPDX-FileCopyrightText = "2025-2026 Abdurashid Abdulkhamitovich Abdukarimov"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ".github/workflows/*.yml"
SPDX-FileCopyrightText = "2025-2026 Abdurashid Abdulkhamitovich Abdukarimov"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "legal-drafts/**"
SPDX-FileCopyrightText = "2025-2026 Abdurashid Abdulkhamitovich Abdukarimov"
SPDX-License-Identifier = "LicenseRef-Terra-Legal-Draft"

[[annotations]]
path = "LICENSES/**"
